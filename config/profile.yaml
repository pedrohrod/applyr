# ============================================================
#  Fill in with your real information.
#  This file drives AI matching, cover letter generation,
#  and automatic answers to screening questions.
# ============================================================

personal:
  name: "Your Name"
  email: "you@email.com"
  phone: "+1 (555) 000-0000"
  location: "Brazil"
  linkedin_url: "https://linkedin.com/in/your-profile"
  github_url: "https://github.com/your-username"
  portfolio_url: ""
  date_of_birth: ""   # optional, e.g. 1998-01-15

professional:
  current_role: "Software Developer"
  experience_years: 3
  summary: |
    Software developer with experience in backend systems and RESTful APIs.
    Passionate about solving complex problems with clean, efficient code.

skills:
  technical:
    - Python
    - JavaScript
    - TypeScript
    - Node.js
    - React
    - SQL
    - PostgreSQL
    - Docker
    - Git
    - AWS
  soft:
    - Teamwork
    - Clear communication
    - Problem solving
    - Fast learner

education:
  - degree: "Bachelor's in Computer Science"
    institution: "University XYZ"
    field_of_study: "Computer Science"
    graduation_year: 2022
    gpa: ""   # optional

experience:
  - position: "Backend Developer"
    company: "Previous Company"
    period: "01/2022 - Present"
    location: "Remote"
    responsibilities:
      - "Built REST APIs with Python/FastAPI"
      - "Maintained and evolved production services"
    skills_acquired:
      - Python
      - PostgreSQL
      - Docker

projects:
  - name: "applyr"
    description: "Automated job application workflow powered by AI"
    link: "https://github.com/pedrohrod/applyr"

certifications: []

languages:
  - language: "Portuguese"
    proficiency: "Native"
  - language: "English"
    proficiency: "Advanced"

interests:
  - Open Source
  - Artificial Intelligence
  - Distributed Systems

# ------------------------------------------------------------
# Availability
# ------------------------------------------------------------
availability:
  notice_period: "Immediately"   # e.g. "2 weeks", "1 month", "Immediately"

# ------------------------------------------------------------
# Salary expectations
# Used to answer form questions and in cover letters
# ------------------------------------------------------------
salary_expectations:
  range: "USD 80,000 - 120,000"   # or "R$ 8.000 - R$ 12.000" for local jobs

# ------------------------------------------------------------
# Self-identification (diversity / EEO questions)
# Leave blank for fields you prefer not to disclose
# ------------------------------------------------------------
self_identification:
  gender: ""
  pronouns: ""
  veteran: "No"
  disability: "No"
  ethnicity: ""

# ------------------------------------------------------------
# Work authorization
# Used to automatically answer work authorization questions
# ------------------------------------------------------------
legal_authorization:
  brazil_work_authorization: "Yes"
  requires_brazil_sponsorship: "No"
  us_work_authorization: "No"
  requires_us_visa: "Yes"
  requires_us_sponsorship: "Yes"
  eu_work_authorization: "No"
  requires_eu_visa: "Yes"
  requires_eu_sponsorship: "Yes"

# ------------------------------------------------------------
# Work preferences
# Used to automatically answer employer questions
# ------------------------------------------------------------
work_preferences:
  remote_work: "Yes"
  in_person_work: "Yes"
  open_to_relocation: "Yes"
  willing_to_complete_assessments: "Yes"
  willing_to_undergo_drug_tests: "Yes"
  willing_to_undergo_background_checks: "Yes"

job_search:
  keywords:
    - "Software Engineer"
    - "Backend Developer"
    - "Python Developer"

  locations:
    - "Brazil"

  # Work modality
  remote: true
  hybrid: true
  onsite: false

  # Experience level (LinkedIn filters)
  experience_level:
    internship: false
    entry: true
    associate: true
    mid_senior_level: true
    director: false
    executive: false

  # Contract type
  job_types:
    full_time: true
    contract: true
    part_time: false
    temporary: false
    internship: false
    other: false
    volunteer: false

  # Date posted filter
  # Options: all_time | month | week | 24_hours
  date_posted: "month"

  # Maximum distance in km/miles (LinkedIn)
  # Accepted values: 0, 5, 10, 25, 50, 100
  distance: 0

filters:
  # Skip jobs from these companies (partial match on company name)
  company_blacklist:
    - "Stefanini"
    - "Wipro"
    - "Infosys"

  # Skip jobs with these words in the title
  title_blacklist:
    - "Senior Principal"
    - "Director"
    - "VP "
    - "Head of"

  # Skip jobs in these locations
  location_blacklist:
    - "India"
    - "China"

  # Do not apply to the same company more than once per session
  apply_once_at_company: true

matching:
  threshold: 70          # minimum score (0–100) to apply
  max_jobs_per_run: 100  # maximum jobs to evaluate per run

platforms:
  linkedin:
    enabled: true
    daily_limit: 40
    easy_apply_only: true     # false = also scrapes jobs that redirect to external portals
  gupy:
    enabled: true
    daily_limit: 30
  portals:
    enabled: false            # set true to apply via Greenhouse / Lever
    daily_limit: 20
    greenhouse: true
    lever: true
    workday: false            # not yet supported

application:
  delay_between_seconds: 45
  randomize_delay: true
  attach_cover_letter: true
  max_per_session: 50     # total application cap per session

tracking:
  database: "data/applications.db"
  export_csv: true
  csv_path: "data/applications.csv"

logging:
  level: "INFO"
  file: "logs/applyr.log"

# Language for AI-generated content
# Options: auto | en | pt | es | de | fr
# "auto" detects the language from the job posting text
language: "auto"

notifications:
  telegram:
    enabled: false
    # Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env
  email:
    enabled: false
    # Set SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, NOTIFY_TO in .env
    smtp_host: "smtp.gmail.com"
    smtp_port: 587

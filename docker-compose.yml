services:
  apply-job:
    build: .
    env_file: .env
    volumes:
      - ./resume:/app/resume       # place your resume.pdf here
      - ./data:/app/data           # SQLite database and CSV results
      - ./logs:/app/logs           # execution logs
      - ./config:/app/config       # settings.yaml and profile.yaml
    environment:
      - PYTHONUNBUFFERED=1
    restart: "no"                  # runs once and stops (use "always" to run continuously)

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro        # read-only access to the database
    environment:
      - DB_PATH=/app/data/applications.db
    restart: unless-stopped
    depends_on:
      - apply-job
